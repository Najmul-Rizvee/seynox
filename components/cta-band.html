<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/scripts/support.js?v=2"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/styles/tokens.css?v=2">
<style>
</style>
</helmet>
<section style="position:relative;overflow:hidden;background:var(--navy);color:var(--paper);font-family:'Archivo',system-ui,sans-serif;padding:clamp(52px,8vw,124px) clamp(18px,4vw,64px);">
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(250,250,248,.07) 0 1px,transparent 1px 72px),repeating-linear-gradient(90deg,rgba(250,250,248,.07) 0 1px,transparent 1px 72px);"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(80% 110% at 88% 10%,rgba(245,130,31,.3) 0%,rgba(245,130,31,0) 62%);"></div>
  <div style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(26px,4vw,72px);align-items:end;max-width:1500px;">
    <h2 style="margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4.8vw,76px);line-height:1;letter-spacing:-.02em;max-width:20ch;text-wrap:balance;">{{ heading }}</h2>
    <div>
      <p style="margin:0;font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:rgba(250,250,248,.82);max-width:44ch;">{{ body }}</p>
      <div style="display:flex;align-items:center;gap:clamp(16px,2.4vw,28px);flex-wrap:wrap;margin-top:clamp(22px,2.8vw,34px);">
        <a href="/contact" style="text-decoration:none;background:var(--accent);color:var(--navy);font-weight:800;font-size:15px;padding:17px 26px;display:inline-flex;align-items:center;gap:12px;transition:background .25s ease;" style-hover="background:#ffa04a;color:#14193B;">
          {{ ctaLabel }}
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <a href="tel:+16040000000" style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(250,250,248,.86);text-decoration:none;border-bottom:1px solid rgba(250,250,248,.4);padding-bottom:3px;">Or call 604 000 0000</a>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:420},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fully documented. Fully yours.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a 20-minute call&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      heading: this.props.heading ?? 'Fully documented. Fully yours.',
      body: this.props.body ?? 'Start with a 20-minute call. We will tell you what we would do, in writing, whether you hire us or not.',
      ctaLabel: this.props.ctaLabel ?? 'Book a 20-minute call'
    };
  }
}
</script>
</body>
</html>
