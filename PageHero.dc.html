<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"></link>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="_ds/modernist-7340adb2-a9c4-48a3-a3be-48505904d71a/styles.css">
<script src="_ds/modernist-7340adb2-a9c4-48a3-a3be-48505904d71a/_ds_bundle.js"></script>
<style>
:root{--accent:#F5821F;--accent-ink:#B45A0C;--navy:#14193B;--ink:#14193B;--soft:rgba(20,25,59,.68);--paper:#FAFAF8;--rule:rgba(20,25,59,.24);--hair:rgba(20,25,59,.11);}
[data-hero-in]{opacity:0;transform:translateY(14px);transition:opacity .55s cubic-bezier(.2,.7,.3,1),transform .55s cubic-bezier(.2,.7,.3,1);}
[data-hero-in][data-seen="1"]{opacity:1!important;transform:none!important;}
@media (max-width:860px){[data-heromark]{display:none!important;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}[data-hero-in]{opacity:1!important;transform:none!important;}}
</style>
</helmet>
<div style="position:relative;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);border-bottom:1px solid var(--hair);">
  <nav aria-label="Breadcrumb" style="padding:13px clamp(18px,4vw,64px);border-bottom:1px solid var(--hair);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);">
    <a href="Home.dc.html" style="text-decoration:none;color:var(--soft);">Home</a>
    <span aria-hidden="true" style="padding:0 8px;color:var(--accent);">/</span>
    <sc-if value="{{ showParent }}" hint-placeholder-val="{{ true }}">
      <span><a href="{{ parentHref }}" style="text-decoration:none;color:var(--soft);">{{ parent }}</a><span aria-hidden="true" style="padding:0 8px;color:var(--accent);">/</span></span>
    </sc-if>
    <span style="color:var(--ink);">{{ crumb }}</span>
  </nav>
  <div style="position:relative;overflow:hidden;">
    <div data-heromark="" aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;width:38%;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(20,25,59,.06) 0 1px,transparent 1px 64px),repeating-linear-gradient(90deg,rgba(20,25,59,.06) 0 1px,transparent 1px 64px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%);"></div>
    <div data-heromark="" aria-hidden="true" style="position:absolute;top:0;right:0;bottom:0;width:38%;pointer-events:none;background:radial-gradient(70% 70% at 80% 20%,rgba(245,130,31,.16) 0%,rgba(245,130,31,0) 60%);"></div>
    <div style="position:relative;padding:clamp(38px,6vw,88px) clamp(18px,4vw,64px) clamp(34px,5vw,72px);max-width:1500px;">
      <div data-hero-in="" style="display:flex;align-items:center;gap:12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);">
        <span aria-hidden="true" style="width:26px;height:2px;background:var(--accent);flex:none;"></span>
        {{ eyebrow }}
      </div>
      <h1 data-hero-in="" style="margin:clamp(16px,2.2vw,30px) 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4.6vw,72px);line-height:1.02;letter-spacing:-.02em;max-width:min(100%,22ch);text-wrap:balance;">{{ title }}</h1>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(18px,3vw,52px);margin-top:clamp(20px,2.6vw,36px);max-width:min(100%,60ch);">
        <p data-hero-in="" style="margin:0;font-size:clamp(15px,1.3vw,19px);line-height:1.55;color:var(--soft);">{{ lede }}</p>
      </div>
      <div data-hero-in="" style="display:flex;align-items:center;gap:clamp(16px,2.4vw,30px);flex-wrap:wrap;margin-top:clamp(24px,3.2vw,44px);">
        <a href="Contact.dc.html" style="text-decoration:none;background:var(--accent);color:var(--navy);font-weight:800;font-size:15px;padding:17px 26px;display:inline-flex;align-items:center;gap:12px;transition:background .25s ease;" style-hover="background:#ffa04a;color:#14193B;">
          Book a 20-minute call
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </a>
        <a href="{{ secondaryHref }}" style="font-size:14px;text-decoration:underline;color:var(--ink);">{{ secondaryLabel }}</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Service&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Page title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lede&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;One paragraph that says what this page is for.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;What we do&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;parentHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Services.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;This page&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const parent = (this.props.parent || '').trim();
    const crumb = (this.props.crumb || '').trim();
    return {
      showParent: !!parent && parent.toLowerCase() !== crumb.toLowerCase(),
      secondaryHref: this.props.secondaryHref || 'Pricing.dc.html',
      secondaryLabel: this.props.secondaryLabel || 'See from-prices →'
    };
  }
  componentDidMount() { this.reveal(); }
  componentDidUpdate() { this.reveal(); }
  reveal() {
    const els = Array.from(document.querySelectorAll('[data-hero-in]:not([data-seen])'));
    if (!els.length) return;
    els.forEach((el, i) => setTimeout(() => el.setAttribute('data-seen', '1'), 60 + i * 70));
  }
}
</script>
</body>
</html>
